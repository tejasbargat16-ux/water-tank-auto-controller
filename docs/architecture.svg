<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">System Architecture - Dual Water Tank Monitor</text>

  <!-- Tanks -->
  <rect x="20" y="100" width="130" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="85" y="136" text-anchor="middle" font-size="14" fill="#1e3a8a">Water Tank 1</text>
  <rect x="20" y="240" width="130" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="85" y="276" text-anchor="middle" font-size="14" fill="#1e3a8a">Water Tank 2</text>

  <!-- Sensors -->
  <rect x="200" y="100" width="140" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="270" y="126" text-anchor="middle" font-size="14" fill="#78350f">HC-SR04 #1</text>
  <text x="270" y="146" text-anchor="middle" font-size="11" fill="#78350f">Ultrasonic sensor</text>
  <rect x="200" y="240" width="140" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="270" y="266" text-anchor="middle" font-size="14" fill="#78350f">HC-SR04 #2</text>
  <text x="270" y="286" text-anchor="middle" font-size="11" fill="#78350f">Ultrasonic sensor</text>

  <!-- Arduino -->
  <rect x="400" y="60" width="160" height="280" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">Arduino Uno</text>
  <text x="480" y="204" text-anchor="middle" font-size="12" fill="#14532d">ATmega328P</text>
  <text x="480" y="226" text-anchor="middle" font-size="12" fill="#14532d">distance -> level</text>
  <text x="480" y="244" text-anchor="middle" font-size="12" fill="#14532d">threshold logic</text>

  <!-- Outputs -->
  <rect x="620" y="50" width="160" height="60" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="700" y="76" text-anchor="middle" font-size="14" fill="#831843">RGB LED - Tank 1</text>
  <text x="700" y="96" text-anchor="middle" font-size="11" fill="#831843">+ 3 x 220 ohm</text>
  <rect x="620" y="170" width="160" height="60" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="700" y="196" text-anchor="middle" font-size="14" fill="#831843">RGB LED - Tank 2</text>
  <text x="700" y="216" text-anchor="middle" font-size="11" fill="#831843">+ 3 x 220 ohm</text>
  <rect x="620" y="290" width="160" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="700" y="316" text-anchor="middle" font-size="14" fill="#4c1d95">Buzzer (5V)</text>
  <text x="700" y="336" text-anchor="middle" font-size="11" fill="#4c1d95">critical-level alert</text>

  <!-- Arrows -->
  <line x1="150" y1="130" x2="198" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="150" y1="270" x2="198" y2="270" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="340" y1="130" x2="398" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="340" y1="270" x2="398" y2="270" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="369" y="122" text-anchor="middle" font-size="10" fill="#334155">D2/D3</text>
  <text x="369" y="262" text-anchor="middle" font-size="10" fill="#334155">D4/D5</text>
  <line x1="560" y1="80" x2="618" y2="80" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="560" y1="200" x2="618" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="560" y1="320" x2="618" y2="320" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="589" y="72" text-anchor="middle" font-size="10" fill="#334155">D8-D10</text>
  <text x="589" y="192" text-anchor="middle" font-size="10" fill="#334155">D11-D13</text>
  <text x="589" y="312" text-anchor="middle" font-size="10" fill="#334155">A0</text>

  <text x="400" y="385" text-anchor="middle" font-size="12" fill="#475569">Sensing  ->  Processing  ->  Indication</text>
</svg>
