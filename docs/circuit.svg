<svg viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="470" fill="#ffffff"/>
  <text x="400" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Wiring / Pin Connections</text>

  <!-- Arduino -->
  <rect x="40" y="45" width="200" height="395" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">Arduino Uno</text>

  <!-- Pin labels (inside board) -->
  <g font-size="12" fill="#14532d" text-anchor="end">
    <text x="228" y="84">D2 (T1 TRIG)</text>
    <text x="228" y="114">D3 (T1 ECHO)</text>
    <text x="228" y="144">D4 (T2 TRIG)</text>
    <text x="228" y="174">D5 (T2 ECHO)</text>
    <text x="228" y="234">D8 (T1 R)</text>
    <text x="228" y="254">D9 (T1 G)</text>
    <text x="228" y="274">D10 (T1 B)</text>
    <text x="228" y="304">D11 (T2 R)</text>
    <text x="228" y="324">D12 (T2 G)</text>
    <text x="228" y="344">D13 (T2 B)</text>
    <text x="228" y="404">A0 (Buzzer)</text>
    <text x="228" y="430">5V / GND common</text>
  </g>

  <!-- Wires -->
  <g stroke-width="2" fill="none">
    <line x1="240" y1="80" x2="520" y2="80" stroke="#d97706"/>
    <line x1="240" y1="110" x2="520" y2="110" stroke="#d97706"/>
    <line x1="240" y1="140" x2="520" y2="140" stroke="#ea580c"/>
    <line x1="240" y1="170" x2="520" y2="170" stroke="#ea580c"/>
    <line x1="240" y1="230" x2="520" y2="230" stroke="#dc2626"/>
    <line x1="240" y1="250" x2="520" y2="250" stroke="#16a34a"/>
    <line x1="240" y1="270" x2="520" y2="270" stroke="#2563eb"/>
    <line x1="240" y1="300" x2="520" y2="300" stroke="#dc2626"/>
    <line x1="240" y1="320" x2="520" y2="320" stroke="#16a34a"/>
    <line x1="240" y1="340" x2="520" y2="340" stroke="#2563eb"/>
    <line x1="240" y1="400" x2="520" y2="400" stroke="#7c3aed"/>
  </g>

  <!-- Resistor markers on RGB wires -->
  <g fill="#ffffff" stroke="#334155" stroke-width="1.5">
    <rect x="340" y="224" width="40" height="12" rx="2"/><rect x="340" y="244" width="40" height="12" rx="2"/><rect x="340" y="264" width="40" height="12" rx="2"/>
    <rect x="340" y="294" width="40" height="12" rx="2"/><rect x="340" y="314" width="40" height="12" rx="2"/><rect x="340" y="334" width="40" height="12" rx="2"/>
  </g>
  <text x="360" y="215" text-anchor="middle" font-size="11" fill="#334155">220 ohm each</text>

  <!-- Devices -->
  <rect x="520" y="62" width="240" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="640" y="88" text-anchor="middle" font-size="14" fill="#78350f">HC-SR04 #1 (Tank 1)</text>
  <text x="640" y="108" text-anchor="middle" font-size="11" fill="#78350f">TRIG / ECHO, VCC 5V, GND</text>
  <rect x="520" y="127" width="240" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="640" y="153" text-anchor="middle" font-size="14" fill="#78350f">HC-SR04 #2 (Tank 2)</text>
  <text x="640" y="173" text-anchor="middle" font-size="11" fill="#78350f">TRIG / ECHO, VCC 5V, GND</text>
  <rect x="520" y="212" width="240" height="75" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="640" y="254" text-anchor="middle" font-size="14" fill="#831843">RGB LED 1 (common cathode)</text>
  <text x="640" y="274" text-anchor="middle" font-size="11" fill="#831843">cathode -> GND</text>
  <rect x="520" y="289" width="240" height="75" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="640" y="324" text-anchor="middle" font-size="14" fill="#831843">RGB LED 2 (common cathode)</text>
  <text x="640" y="344" text-anchor="middle" font-size="11" fill="#831843">cathode -> GND</text>
  <rect x="520" y="380" width="240" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="640" y="405" text-anchor="middle" font-size="14" fill="#4c1d95">Buzzer 5V (+ to A0, - to GND)</text>

  <text x="400" y="458" text-anchor="middle" font-size="11" fill="#475569">All VCC to Arduino 5V and all GND to Arduino GND (common ground).</text>
</svg>
